<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 축하해! 🎉</title>
  <style>
    /* 기본 여백 초기화 및 박스 모델 설정 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 화면 전체를 채우고 중앙 정렬하는 메인 컨테이너 */
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 화사하고 부드러운 핑크 계열 그라데이션 배경 */
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #ff758c 100%);
      color: #ffffff;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
      overflow: hidden;
      position: relative;
      text-align: center;
      padding: 20px;
    }

    /* 축하 메시지를 감싸는 반투명 글래스모피즘 카드 */
    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 32px;
      padding: 60px 45px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 45px rgba(214, 51, 108, 0.2);
      z-index: 10;
      animation: fadeInScale 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 위아래로 통통 튀는 케이크 이모지 스타일 */
    .cake-emoji {
      font-size: clamp(4.5rem, 12vw, 6.5rem);
      display: inline-block;
      margin-bottom: 24px;
      filter: drop-shadow(0 12px 15px rgba(0, 0, 0, 0.15));
      /* 부드럽고 탄력 있게 튀는 애니메이션 적용 */
      animation: bounceCake 1.4s infinite ease-in-out;
      user-select: none;
    }

    /* 메인 생일 축하 제목 */
    h1 {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 16px;
      text-shadow: 0 4px 12px rgba(214, 51, 108, 0.35);
      word-break: keep-all;
    }

    /* 따뜻한 서브 메시지 */
    p {
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 500;
      line-height: 1.6;
      opacity: 0.95;
      text-shadow: 0 2px 6px rgba(214, 51, 108, 0.25);
      word-break: keep-all;
    }

    /* 배경에 떠다니는 은은한 축하 장식 이모지들 */
    .deco {
      position: absolute;
      font-size: 2rem;
      opacity: 0.65;
      user-select: none;
      pointer-events: none;
      animation: floatDeco 5s infinite ease-in-out alternate;
    }

    .deco-1 { top: 12%; left: 15%; animation-delay: 0s; font-size: 2.2rem; }
    .deco-2 { top: 20%; right: 18%; animation-delay: 1.2s; font-size: 1.8rem; }
    .deco-3 { bottom: 15%; left: 20%; animation-delay: 2.4s; font-size: 2.4rem; }
    .deco-4 { bottom: 18%; right: 15%; animation-delay: 0.8s; font-size: 2rem; }
    .deco-5 { top: 50%; left: 8%; animation-delay: 1.8s; font-size: 1.6rem; }
    .deco-6 { top: 45%; right: 8%; animation-delay: 2.8s; font-size: 1.8rem; }

    /* 케이크 통통 튀는 키프레임 애니메이션 */
    @keyframes bounceCake {
      0%, 100% {
        transform: translateY(0) scale(1.04, 0.96);
      }
      50% {
        transform: translateY(-28px) scale(0.96, 1.04);
      }
    }

    /* 배경 장식 이모지 부유 애니메이션 */
    @keyframes floatDeco {
      0% {
        transform: translateY(0px) rotate(-8deg);
      }
      100% {
        transform: translateY(-20px) rotate(12deg);
      }
    }

    /* 페이지 진입 시 카드가 부드럽게 나타나는 애니메이션 */
    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.92) translateY(15px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* 모바일 작은 화면 대응 여백 조정 */
    @media (max-width: 480px) {
      .card {
        padding: 45px 25px;
        border-radius: 24px;
      }
    }
  </style>
</head>
<body>

  <!-- 배경 축하 분위기 장식 -->
  <span class="deco deco-1" aria-hidden="true">🎈</span>
  <span class="deco deco-2" aria-hidden="true">✨</span>
  <span class="deco deco-3" aria-hidden="true">🎁</span>
  <span class="deco deco-4" aria-hidden="true">💖</span>
  <span class="deco deco-5" aria-hidden="true">🎊</span>
  <span class="deco deco-6" aria-hidden="true">✨</span>

  <!-- 중앙 생일 축하 카드 -->
  <main class="card">
    <div class="cake-emoji" role="img" aria-label="생일 케이크">🎂</div>
    <h1>생일 축하해! 🎉</h1>
    <p>오늘 하루 세상에서 가장 행복하고<br>반짝이는 순간들로 가득하길 바랄게!</p>
  </main>

</body>
</html>
